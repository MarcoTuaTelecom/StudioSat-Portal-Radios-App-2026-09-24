# Studio Sat complete web layer
server { listen 80; listen [::]:80; server_name radio.studiosatweb.com.br www.radio.studiosatweb.com.br radioprincipal.studiosatweb.com.br www.radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br www.radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br www.radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br www.radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br www.radiocountry.studiosatweb.com.br; return 301 https://$host$request_uri; }
server { listen 443 ssl; listen [::]:443 ssl; server_name radio.studiosatweb.com.br www.radio.studiosatweb.com.br; ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem; root /var/www/studiosat-radio-site; index index.html; add_header X-StudioSat-Web "complete-20260924" always;
location = / { try_files /portal/index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; } location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; } location = /listen { return 301 /listen/; } location ^~ /listen/ { try_files $uri $uri/ /listen/index.html; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; add_header Service-Worker-Allowed "/listen/" always; } location = /app { return 301 /app/; } location ^~ /app/ { try_files $uri $uri/ /app/index.html; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; } location ~ ^/(emissora|emissoras|programacao|noticias|sobre|contato)(/.*)?$ { try_files /portal/index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; } location ~ ^/(radioprincipal|radiopop|radiorock|radioclassicas|radiocountry)/ { proxy_pass http://127.0.0.1:8888; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 60s; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "no-cache, no-store, must-revalidate" always; } location / { try_files /portal/index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; } }
server { listen 443 ssl; listen [::]:443 ssl; server_name radioprincipal.studiosatweb.com.br www.radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br www.radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br www.radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br www.radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br www.radiocountry.studiosatweb.com.br; ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem; root /var/www/studiosat-radio-site; index index.html; add_header X-StudioSat-Web "complete-20260924-station" always; location = / { try_files /listen/index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; } location ^~ /assets/ { try_files $uri =404; } location = /listen { return 301 /listen/; } location ^~ /listen/ { try_files $uri $uri/ /listen/index.html; add_header Cache-Control "no-store" always; add_header Service-Worker-Allowed "/listen/" always; } location = /app { return 302 https://radio.studiosatweb.com.br/app/; } location ^~ /app/ { return 302 https://radio.studiosatweb.com.br/app/; } location ~ ^/(radioprincipal|radiopop|radiorock|radioclassicas|radiocountry)/ { proxy_pass http://127.0.0.1:8888; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 60s; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "no-cache, no-store, must-revalidate" always; } location / { try_files /listen/index.html =404; add_header Cache-Control "no-store" always; } }