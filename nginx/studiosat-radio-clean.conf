# Rádio Studio Sat — camada web isolada
# Portal/player/app + proxy HLS. Não controla a origem de áudio.

server {
    listen 80;
    listen [::]:80;
    server_name radio.studiosatweb.com.br radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br www.radio.studiosatweb.com.br www.radioprincipal.studiosatweb.com.br www.radiopop.studiosatweb.com.br www.radiorock.studiosatweb.com.br www.radioclassicas.studiosatweb.com.br www.radiocountry.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radio.studiosatweb.com.br radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br;

    ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-radio-player;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-StudioSat-Web "player-v20260924" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        try_files /sw.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location ^~ /assets/ {
        alias /var/www/studiosat-radio-assets/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /app { return 301 /app/; }
    location = /app/ {
        root /var/www/studiosat-radio-app;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~ ^/(radioprincipal|radiopop|radiorock|radioclassicas|radiocountry)/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}

