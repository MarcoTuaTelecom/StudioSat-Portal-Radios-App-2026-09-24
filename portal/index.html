<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Sat Rádio</title>
<meta name="theme-color" content="#f5f7f8">
<meta name="description" content="Portal oficial Studio Sat — cinco emissoras ao vivo.">
<meta name="studiosat-build" content="complete-rebuild-2026-09-24">
<link rel="stylesheet" href="/assets/portal-complete.css">
</head>
<body>
<header class="header">
  <div class="page header-grid">
    <a class="brand" data-route href="/">
      <div class="brand-main">STUDIO SAT <span class="sound-bars"><i></i><i></i><i></i><i></i></span></div>
      <div class="brand-sub">CINCO RÁDIOS. UMA SÓ PAIXÃO.</div>
    </a>
    <nav class="nav">
      <a data-route href="/">INÍCIO</a>
      <a data-route href="/emissoras/">RÁDIOS</a>
      <a data-route href="/programacao/">PROGRAMAÇÃO</a>
      <a data-route href="/noticias/">NOTÍCIAS</a>
      <a data-route href="/sobre/">SOBRE</a>
      <a data-route href="/contato/">CONTATO</a>
    </nav>
    <button class="header-search" aria-label="Pesquisar">⌕</button>
    <span class="header-live">((•))&nbsp;&nbsp; AO VIVO</span>
    <div class="header-note">MÚSICA QUE<br>CONECTA VOCÊ<br>24 HORAS</div>
  </div>
</header>

<main id="app">
  <div class="page loading">Carregando Studio Sat…</div>
</main>

<div class="bottom-player">
  <div class="page player-grid">
    <div class="player-current">
      <div class="player-station-logo"><span>STUDIO<br>SAT</span><i></i><i></i><i></i></div>
      <div class="player-current-text">
        <strong id="pStation">Studio Sat Principal</strong>
        <span id="pProgram">Hits da Manhã</span>
        <small id="pTime">09:00 – 12:00</small><span id="pSignal" class="signal-pill" data-state="IDLE"><i></i><span>Aguardando reprodução</span></span>
      </div>
      <button class="heart" aria-label="Favoritar">♡</button>
    </div>

    <div class="transport">
      <button class="transport-small" id="prevBtn" aria-label="Anterior">|◀</button>
      <button class="transport-main" id="pPlay" aria-label="Play">▶</button>
      <button class="transport-small" id="nextBtn" aria-label="Próxima">▶|</button>
    </div>

    <div class="player-tools">
      <button class="tool-btn" id="mute" aria-label="Mudo">🔊</button>
      <input class="volume" id="vol" type="range" min="0" max="1" step=".01">
      <button class="tool-btn" id="shareBtn" aria-label="Compartilhar">⌯</button>
      <span class="tool-separator"></span>
      <button class="tool-btn" aria-label="Fila">☷</button>
      <a href="/listen/" class="network-note">ABRIR APP<br>STUDIO SAT</a>
    </div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous" playsinline></audio>
<script src="/assets/vendor/hls.min.js"></script>
<script type="module" src="/assets/portal-complete.js"></script>
</body>
</html>
