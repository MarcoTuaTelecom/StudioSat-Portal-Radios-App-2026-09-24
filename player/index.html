<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Rádio Studio Sat — Ao Vivo</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/player.css"><script src="/assets/vendor/hls.min.js" defer></script><script src="/assets/js/stations.js" defer></script><script src="/assets/js/hls-controller.js" defer></script>
</head><body>
<header class="app-head"><div class="app-head-in"><div class="brand">RÁDIO STUDIO SAT</div><button id="installBtn" class="install-btn" hidden>Instalar</button><a class="head-link" href="/app/">App</a><a class="head-link portal-link" href="https://www.radio.studiosatweb.com.br">Portal</a></div></header>
<main><section class="stage"><div class="live-badge"><span class="live-dot"></span><span>TRANSMISSÃO AO VIVO</span></div><h1 id="stationTitle" class="station-title">PRINCIPAL</h1><div id="artist" class="artist">Rádio Studio Sat</div><div id="track" class="track">Programação ao vivo</div><div id="vu" class="vu" aria-label="Nível de áudio"></div><div id="status" class="status">Preparando áudio…</div></section><div id="stationTabs" class="station-tabs"></div><section class="panel"><h2>Favoritos</h2><div id="favorites" class="fav-list"></div></section></main>
<div class="player-bar"><div class="bar-in"><div class="bar-now"><b id="now">Rádio Studio Sat — Principal</b><span>AAC ao vivo</span></div><button id="play" class="big-play" aria-label="Reproduzir">▶</button><div class="bar-right"><button id="favorite" aria-label="Favoritar">♡</button><button id="mute" aria-label="Silenciar">🔊</button><label class="sr-only" for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></div></div>
<audio id="audio" preload="none" playsinline crossorigin="anonymous"></audio>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const stations=window.STUDIOSAT_STATIONS,byHost=window.STUDIOSAT_STATION_BY_HOST,$=id=>document.getElementById(id),audio=$('audio'),statusEl=$('status'),play=$('play'),favorite=$('favorite'),mute=$('mute'),volume=$('volume');let current=stations[0],deferredInstall=null,audioCtx=null,analyser=null,sourceNode=null,raf=0;
 let savedFavorites=[];try{savedFavorites=JSON.parse(localStorage.getItem('studiosat:favorites')||'[]');if(!Array.isArray(savedFavorites))savedFavorites=[]}catch{savedFavorites=[]}
 const favorites=new Set(savedFavorites);
 const controller=new StudioSatAudioController(audio,{streamBase:'',onStatus:(t,k)=>{statusEl.textContent=t;statusEl.className='status '+k},onPlaying:()=>{play.textContent='❚❚';startVU()},onPause:()=>play.textContent='▶'});
 function renderTabs(){const g=$('stationTabs');g.innerHTML='';stations.forEach(s=>{const b=document.createElement('button');b.textContent=s.name;b.className=s.slug===current.slug?'active':'';b.onclick=()=>select(s,true);g.appendChild(b)})}
 function renderFavorites(){const g=$('favorites');g.innerHTML='';const list=stations.filter(s=>favorites.has(s.slug));if(!list.length){g.innerHTML='<span class="empty">Nenhuma emissora favoritada ainda.</span>';return}list.forEach(s=>{const b=document.createElement('button');b.className='fav-chip';b.textContent=s.name;b.onclick=()=>select(s,true);g.appendChild(b)})}
 function syncFavorite(){favorite.textContent=favorites.has(current.slug)?'♥':'♡';favorite.setAttribute('aria-pressed',favorites.has(current.slug)?'true':'false')}
 async function refreshMeta(){try{const r=await fetch(`/assets/now/${current.slug}.json`,{cache:'no-store'});if(!r.ok)return;const m=await r.json();$('artist').textContent=m.artist||current.full;$('track').textContent=m.title||'Programação ao vivo'}catch{}}
 async function select(s,autoplay=false){current=s;localStorage.setItem('studiosat:lastStation',s.slug);$('stationTitle').textContent=s.name.toUpperCase();$('now').textContent=`Rádio Studio Sat — ${s.name}`;$('artist').textContent=s.full;$('track').textContent=s.desc;document.title=`Rádio Studio Sat — ${s.name}`;document.documentElement.style.setProperty('--station-accent',s.accent);renderTabs();syncFavorite();history.replaceState(null,'',`/?station=${encodeURIComponent(s.slug)}`);await controller.attach(s,{autoplay});refreshMeta()}
 favorite.onclick=()=>{favorites.has(current.slug)?favorites.delete(current.slug):favorites.add(current.slug);localStorage.setItem('studiosat:favorites',JSON.stringify([...favorites]));syncFavorite();renderFavorites()};
 play.onclick=()=>audio.paused?controller.play():controller.pause();volume.oninput=()=>controller.setVolume(volume.value);mute.onclick=()=>mute.textContent=controller.toggleMute()?'🔇':'🔊';controller.setVolume(.8);
 for(let i=0;i<24;i++)$('vu').appendChild(document.createElement('i'));
 function setupVU(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=64;sourceNode=audioCtx.createMediaElementSource(audio);sourceNode.connect(analyser);analyser.connect(audioCtx.destination)}catch{}}
 function startVU(){setupVU();if(!analyser)return;cancelAnimationFrame(raf);const bars=[...$('vu').children],data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{analyser.getByteFrequencyData(data);bars.forEach((b,i)=>b.style.height=`${6+Math.round((data[i%data.length]/255)*46)}px`);raf=requestAnimationFrame(tick)};tick()}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').hidden=false});$('installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('installBtn').hidden=true};
 if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
 const q=new URLSearchParams(location.search).get('station'),hk=location.hostname.toLowerCase().split('.')[0],wanted=q||byHost[hk]||localStorage.getItem('studiosat:lastStation')||'radioprincipal';current=stations.find(s=>s.slug===wanted)||stations[0];
 renderFavorites();select(current,false);setInterval(refreshMeta,15000);
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();audio.paused?controller.play():controller.pause()}if(e.key==='m'||e.key==='M'){mute.textContent=controller.toggleMute()?'🔇':'🔊'}});
});
</script></body></html>
