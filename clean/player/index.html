<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Rádio Studio Sat — Ao vivo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/vendor/hls.min.js" defer></script>
<script src="/assets/js/stations.js" defer></script>
<script src="/assets/js/player-engine.js" defer></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Rádio Studio Sat</div><a href="https://www.radio.studiosatweb.com.br/">Portal</a></header>
<section class="stage">
<div class="live"><span class="dot"></span><span>Transmissão ao vivo</span></div>
<h1 id="title" class="station-title">Principal</h1>
<p id="desc" class="station-desc">Grandes sucessos e programação principal</p>
<div id="status" class="status">Preparando…</div>
</section>
<div id="tabs" class="tabs" role="tablist"></div>
</div>
<div class="bar"><div class="bar-in">
<div class="bar-now"><b id="now">Rádio Studio Sat — Principal</b><span>AAC HLS · baixa latência</span></div>
<button id="play" class="play" type="button" aria-label="Reproduzir">▶</button>
<button id="mute" class="mute" type="button" aria-label="Mudo">🔊</button>
<input id="volume" class="vol" type="range" min="0" max="1" step="0.01" value="0.85">
</div></div>
<audio id="audio" playsinline crossorigin="anonymous"></audio>
<script>
window.addEventListener("DOMContentLoaded",function(){
var stations=window.STUDIOSAT_STATIONS,audio=document.getElementById("audio"),statusEl=document.getElementById("status"),playBtn=document.getElementById("play"),muteBtn=document.getElementById("mute"),volume=document.getElementById("volume"),tabs=document.getElementById("tabs"),current=stations[0];
function setStatus(s){statusEl.textContent=s.text;statusEl.className="status "+(s.kind||"");}
var player=new StudioSatPlayer(audio,setStatus);
function renderTabs(){tabs.innerHTML="";stations.forEach(function(s){var b=document.createElement("button");b.type="button";b.textContent=s.name;b.className=s.slug===current.slug?"active":"";if(s.slug===current.slug)b.style.background=s.accent;b.onclick=function(){select(s,true)};tabs.appendChild(b)});}
function select(s,autoplay){current=s;document.documentElement.style.setProperty("--accent",s.accent);document.getElementById("title").textContent=s.name;document.getElementById("desc").textContent=s.desc;document.getElementById("now").textContent="Rádio Studio Sat — "+s.name;document.title="Rádio Studio Sat — "+s.name;try{localStorage.setItem("studiosat:station",s.slug)}catch(_){}history.replaceState(null,"","/?station="+encodeURIComponent(s.slug));renderTabs();player.attach(s,!!autoplay);}
playBtn.onclick=function(){if(audio.paused)player.play();else player.pause()};
audio.addEventListener("play",function(){playBtn.textContent="❚❚"});audio.addEventListener("pause",function(){playBtn.textContent="▶"});
volume.oninput=function(){player.setVolume(volume.value)};player.setVolume(0.85);
muteBtn.onclick=function(){muteBtn.textContent=player.toggleMute()?"🔇":"🔊"};
var q=new URLSearchParams(location.search).get("station"),host=location.hostname.toLowerCase().split(".")[0],saved=null;try{saved=localStorage.getItem("studiosat:station")}catch(_){}
var wanted=q||(stations.some(function(s){return s.slug===host})?host:null)||saved||"radioprincipal";
current=stations.find(function(s){return s.slug===wanted})||stations[0];select(current,false);
if("mediaSession"in navigator){navigator.mediaSession.setActionHandler("play",function(){player.play()});navigator.mediaSession.setActionHandler("pause",function(){player.pause()})}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
});
</script>
</body>
</html>
